[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/TheBeastLT/parse-torrent-title"
rust-version = "1.88"

[workspace.dependencies]
parse-torrent-title = { path = "crates/parse-torrent-title" }
indexmap = { version = "2", features = ["serde"] }
regress = "0.12"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }
# already dependencies of `regex`, used directly for the literal filter
regex-syntax = "0.8"
aho-corasick = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["alloc"] }

[profile.release]
lto = true
codegen-units = 1
