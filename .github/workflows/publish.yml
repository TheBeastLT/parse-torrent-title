name: Publish

# publishes the crate and the npm packages for a release tagged `v<version>`, which sets their version: the versions
# in the repository are placeholders. Both registries trust this workflow (trusted publishing), so no tokens are stored.
on:
  release:
    types: [published]

permissions:
  contents: read

defaults:
  run:
    working-directory: crates/parse-torrent-title-node

jobs:
  version:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - id: tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release tag $TAG is not v<semver>"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  crate:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: sed -i 's/^version = ".*"/version = "${{ needs.version.outputs.version }}"/' Cargo.toml
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # the version set above leaves the checkout dirty
      - run: cargo publish -p parse-torrent-title --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        settings:
          - { host: macos-latest, target: aarch64-apple-darwin, build: npm run build -- --target aarch64-apple-darwin }
          - { host: macos-latest, target: x86_64-apple-darwin, build: npm run build -- --target x86_64-apple-darwin }
          - { host: windows-latest, target: x86_64-pc-windows-msvc, build: npm run build -- --target x86_64-pc-windows-msvc }
          - { host: ubuntu-latest, target: x86_64-unknown-linux-gnu, build: npm run build -- --target x86_64-unknown-linux-gnu --use-napi-cross }
          - { host: ubuntu-latest, target: aarch64-unknown-linux-gnu, build: npm run build -- --target aarch64-unknown-linux-gnu --use-napi-cross }
          - { host: ubuntu-latest, target: x86_64-unknown-linux-musl, build: npm run build -- --target x86_64-unknown-linux-musl -x }
          - { host: ubuntu-latest, target: aarch64-unknown-linux-musl, build: npm run build -- --target aarch64-unknown-linux-musl -x }
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.settings.target }}
      # `-x` builds musl targets with cargo-zigbuild, which it installs itself
      - uses: mlugg/setup-zig@v2
        if: contains(matrix.settings.target, 'musl')
      - run: npm ci
      - run: ${{ matrix.settings.build }}
        shell: bash
      - uses: actions/upload-artifact@v6
        with:
          name: bindings-${{ matrix.settings.target }}
          path: crates/parse-torrent-title-node/*.node
          if-no-files-found: error

  npm:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      # trusted publishing needs npm 11.5.1 or later
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm version ${{ needs.version.outputs.version }} --no-git-tag-version --allow-same-version
      # the loader of the platform packages, the same on every platform, which checks their version
      - run: npm run build
      - uses: actions/download-artifact@v7
        with:
          path: crates/parse-torrent-title-node/artifacts
      - run: npx napi create-npm-dirs
      - run: npx napi artifacts
      # publishes the platform packages first, see the prepublishOnly script
      - run: npm publish --access public
