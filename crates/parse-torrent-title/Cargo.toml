[package]
name = "parse-torrent-title"
description = "Parse torrent title to extract useful information"
keywords = ["parse", "torrent", "title", "name", "extract"]
categories = ["parser-implementations"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# checks the shortcuts taken around the backtracking regex engine (translated patterns, literal filtering) against
# it, panicking when one changes a match; meant for the test suite
verify-regex = ["fastjs-regex/verify"]

[dependencies]
fastjs-regex = { path = "../fastjs-regex", version = "0.0.0" }
indexmap.workspace = true
regex-syntax.workspace = true
aho-corasick.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true

[dev-dependencies]
serde_json.workspace = true

[[test]]
name = "parse"
path = "tests/parse/main.rs"
